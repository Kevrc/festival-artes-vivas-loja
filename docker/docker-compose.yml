name: fiavl
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fiavl
      POSTGRES_PASSWORD: fiavl
      POSTGRES_DB: fiavl
    ports:
      - "5433:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiavl"]
      interval: 2s
      retries: 20
  # Spec 004: bandeja de correos de prueba (SMTP 1025, web http://localhost:8025). Solo desarrollo.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
  clamav:
    image: clamav/clamav:latest
    profiles: ["antivirus"]
    ports:
      - "3310:3310"
volumes:
  datos:
