name: fiavl
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fiavl
      POSTGRES_PASSWORD: fiavl
      POSTGRES_DB: fiavl
    ports:
      - "5433:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiavl"]
      interval: 2s
      retries: 20
  clamav:
    image: clamav/clamav:latest
    profiles: ["antivirus"]
    ports:
      - "3310:3310"
volumes:
  datos:
